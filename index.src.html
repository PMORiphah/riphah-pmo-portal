<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to return
         anything but 0 on iOS. Without it the existing safe-area padding on
         the bottom tab bar is silently inert once installed to the home screen. -->
    <title>PMO Portal — Riphah International University</title>
    <link rel="icon" type="image/png" href="/riphah-pmo-portal/favicon.png" />
    <link rel="shortcut icon" href="/riphah-pmo-portal/favicon.png" />
    <!-- Add to Home Screen. Relative paths on purpose: the preview build is
         served from a /preview/ subfolder and Vite does not rewrite absolute
         paths in this file, so "./" is what keeps both environments correct. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0A1A2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" keeps app content below the status bar. "black-translucent" looks
         nicer (full-bleed background behind the clock) but pushes the header
         under the notch unless every top-level surface adds safe-area padding.
         Not worth the risk of an unusable header on someone's phone. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="PMO Portal" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>* { margin:0; padding:0; box-sizing:border-box; } body { font-family:'Inter',sans-serif; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
